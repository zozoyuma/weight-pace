<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a66"><meta name="apple-mobile-web-app-capable" content="yes"><title>Weight Pace</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css"></head><body><header><b>Weight Pace</b><small>11/21までに89kg</small></header><main><section id="home" class="page active"><div class="hero"><small>現在の体重</small><h1 id="nowW">未入力</h1><div id="remain">目標まで --</div></div><div class="card"><h2>体重推移と目標曲線</h2><canvas id="chart" width="700" height="360"></canvas><div class="legend"><span>● 実測</span><span>━ 7日平均</span><span>┄ 目標</span></div></div><div class="card"><div class="row"><h2>今週の判定</h2><b id="status">記録待ち</b></div><p id="why">まず記録を始めましょう。</p><hr><small>今週変えること</small><h3 id="action">朝の体重を記録する</h3></div></section><section id="entry" class="page"><div class="card"><h2>今日の記録</h2><label>日付<input id="date" type="date"></label><label>体重 kg<input id="weight" type="number" inputmode="decimal" step="0.1" min="40" max="200"></label><label>歩数<input id="steps" type="number" inputmode="numeric" min="0"></label><label>夕食量<select id="dinner"><option>少なめ</option><option selected>普通</option><option>多め</option></select></label><label>睡眠時間<input id="sleep" type="number" inputmode="decimal" step="0.1" min="0" max="24"></label></div><div class="card"><div class="row"><h2>ジム・運動</h2><button class="minor" id="addWorkout">追加</button></div><div id="workouts"></div><p class="muted">消費カロリーは運動時間・強度・体重からの概算です。</p></div><button id="save" class="primary">記録する</button></section><section id="analysis" class="page"><div class="card"><h2>分析</h2><h1 id="analysisStatus">記録待ち</h1><p id="analysisWhy"></p></div><div class="card"><h2>直近7日</h2><div id="metrics"></div></div><div class="card accent"><small>今週変えること</small><h2 id="analysisAction"></h2><p>改善提案は一度に1つだけ表示します。</p></div></section><section id="history" class="page"><div class="card"><div class="row"><h2>履歴</h2><button class="minor" id="export">CSV</button></div><div id="historyList"></div></div></section></main><nav><button data-page="home">ホーム</button><button data-page="entry">記録</button><button data-page="analysis">分析</button><button data-page="history">履歴</button></nav><dialog id="workoutDialog"><form method="dialog"><h2>運動を追加</h2><label>運動<select id="activity"><option>筋トレ</option><option>ウォーキング</option><option>ランニング</option><option>自転車</option><option>クロストレーナー</option><option>水泳</option></select></label><label>時間（分）<input id="minutes" type="number" value="30" min="5" step="5"></label><label>強度<select id="intensity"><option>軽い</option><option selected>普通</option><option>きつい</option></select></label><div class="dialogBtns"><button value="cancel">キャンセル</button><button id="confirmWorkout" value="default" class="primary">追加</button></div></form></dialog><script src="app.js"></script></body></html>
